# Builds and tests the Windows program on every push to main; a tag v<version>
# (or traditional-v<version>) also publishes the installer and a zip as a release.
name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*', 'traditional-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install wxPython Pillow setuptools "timezonefinder>=6,<9" tzdata pyinstaller

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v=${GITHUB_REF##*/}; v=${v#traditional-}; v=${v#v}; else v=0.0.0-${GITHUB_SHA::7}; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -Version $env:VERSION

      - name: Calculations match the reference
        run: |
          python tests/refdump.py . build/py3.json
          python tests/refcompare.py tests/reference/se210.json.gz build/py3.json

      - name: Time-zone tests
        run: python -m unittest discover -s tests -p test_auto_timezone.py

      - name: Time-zone lookup works when packaged
        shell: pwsh
        run: |
          Set-Content build\tzcheck.py "import auto_timezone`nr = auto_timezone.resolve_timezone(1988, 6, 8, 19, 15, 0, 43.32, 21.9)`nprint(r)`nassert r[:3] == ('Europe/Belgrade', 60, True)"
          pyinstaller --noconfirm --console --name tzcheck --paths $PWD --collect-all timezonefinder --collect-data tzdata --distpath build\tzdist --workpath build\tzwork --specpath build build\tzcheck.py
          build\tzdist\tzcheck\tzcheck.exe
          if ($LASTEXITCODE) { throw "the packaged time-zone lookup failed" }

      - name: The program starts
        shell: pwsh
        run: |
          $p = Start-Process dist\Morinus\Morinus.exe -WorkingDirectory dist\Morinus -PassThru
          Start-Sleep -Seconds 30
          $p.Refresh()
          if ($p.HasExited) { throw "Morinus.exe exited with code $($p.ExitCode)" }
          $title = $p.MainWindowTitle
          Write-Host "main window: '$title'"
          Stop-Process -Id $p.Id -Force
          if ($title -notlike 'Morinus*') { throw "unexpected main window '$title'" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Morinus -DestinationPath "dist\MorinusTraditional-$env:VERSION-windows.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: MorinusTraditional-windows
          path: |
            dist/MorinusTraditional-*-setup.exe
            dist/MorinusTraditional-*-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/MorinusTraditional-*-setup.exe dist/MorinusTraditional-*-windows.zip \
            --target "$GITHUB_SHA" --title "Morinus Traditional $VERSION" --notes-file packaging/windows/release-notes.md
